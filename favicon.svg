<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f4060"/>
      <stop offset="100%" stop-color="#1aada3"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="url(#bg)"/>
  <!-- Inset stroke so it doesn't get clipped at edges -->
  <rect x="1" y="1" width="30" height="30" rx="5.5" fill="none" stroke="#20B2AA" stroke-width="0.75" opacity="0.6"/>

  <!-- Base platform -->
  <rect x="3" y="26" width="26" height="2" rx="1" fill="#20B2AA" opacity="0.5"/>

  <!-- Pole 1 (center x=8) -->
  <rect x="7" y="7" width="2" height="19" rx="1" fill="#20B2AA" opacity="0.35"/>
  <rect x="5" y="23.5" width="6" height="2.5" rx="1.25" fill="#e74c3c"/>
  <rect x="5" y="20"   width="6" height="2.5" rx="1.25" fill="#f1c40f"/>

  <!-- Pole 2 (center x=16) -->
  <rect x="15" y="7" width="2" height="19" rx="1" fill="#20B2AA" opacity="0.35"/>
  <rect x="13" y="23.5" width="6" height="2.5" rx="1.25" fill="#3498db"/>
  <rect x="13" y="20"   width="6" height="2.5" rx="1.25" fill="#2ecc71"/>
  <rect x="13" y="16.5" width="6" height="2.5" rx="1.25" fill="#ff9100"/>

  <!-- Pole 3 (center x=24) -->
  <rect x="23" y="7" width="2" height="19" rx="1" fill="#20B2AA" opacity="0.35"/>
  <rect x="21" y="23.5" width="6" height="2.5" rx="1.25" fill="#9b59b6"/>
  <rect x="21" y="20"   width="6" height="2.5" rx="1.25" fill="#e74c3c"/>
  <rect x="21" y="16.5" width="6" height="2.5" rx="1.25" fill="#20B2AA"/>
  <rect x="21" y="13"   width="6" height="2.5" rx="1.25" fill="#3498db"/>
</svg>

  <rect x="13" y="16.5" width="6" height="2.5" rx="1.25" fill="#ff9100"/>

  <!-- Pole 3 (center x=25) -->
  <rect x="24" y="8" width="2" height="18" rx="1" fill="#20B2AA" opacity="0.35"/>
  <rect x="22" y="23.5" width="6" height="2.5" rx="1.25" fill="#9b59b6"/>

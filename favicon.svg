  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="url(#bg)"/>
  <rect width="32" height="32" rx="6" fill="none" stroke="#20B2AA" stroke-width="0.75" opacity="0.6"/>

  <!-- Base platform -->
